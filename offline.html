<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080810">
  <title>1831 Studio - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080810;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .panel {
      max-width: 360px;
      padding: 32px 24px;
      border: 1px solid #ff174f66;
      border-radius: 24px;
      background: #170810;
      box-shadow: 0 0 35px #ff174f22;
    }
    h1 { color: #ff386f; }
    p { color: #cbb8c2; line-height: 1.6; }
    button {
      border: 0;
      border-radius: 30px;
      padding: 14px 24px;
      background: #ff174f;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>1831 STUDIO ❤️</h1>
    <h2>You're Offline</h2>
    <p>Internet connection check karo aur dobara try karo.</p>
    <button onclick="location.reload()">TRY AGAIN</button>
  </main>
</body>
</html>
